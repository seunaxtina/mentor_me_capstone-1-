name: Mentor Me CI / Automated Test Pipeline

on:
  push:
    branches: [ main, master, 2026-cohort, team-prism-strategists ]
  pull_request:
    branches: [ main, master, 2026-cohort, team-prism-strategists ]

jobs:
  test:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "mentor_me_capstone/matching/requirements.txt" ]; then
            pip install -r mentor_me_capstone/matching/requirements.txt
          elif [ -f "matching/requirements.txt" ]; then
            pip install -r matching/requirements.txt
          else
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run Automated Test Suites
        run: |
          if [ -d "mentor_me_capstone/matching" ]; then
            cd mentor_me_capstone/matching
          elif [ -d "matching" ]; then
            cd matching
          fi
          python -m pytest backend/ test_matching_scenarios.py -q
